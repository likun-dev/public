# 样例 1：依赖缓存（npm / node_modules）
# 用途：验证 actions/cache 对 lockfile 哈希 key 的命中与 restore-keys 回退
# 触发：push 到 main，或手动 workflow_dispatch
name: cache-example-npm

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-example-npm.yml'
      - 'cache-examples/npm/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cache-examples/npm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 标准 actions/cache：缓存 node_modules（key 含 lockfile 哈希）
      - uses: actions/cache@v4
        id: npm-cache
        with:
          path: cache-examples/npm/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('cache-examples/npm/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Report cache status
        run: |
          echo "cache-hit (actions/cache): ${{ steps.npm-cache.outputs.cache-hit }}"
          npm run build
